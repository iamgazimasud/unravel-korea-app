name: Test APK

# Builds an installable Android test app on every push to main (or Actions → Test APK → Run workflow),
# smoke-tests it on an Android emulator, and — only if that passes, and only on main — publishes it on the
# "test-build" release:
#   https://github.com/<owner>/<repo>/releases/tag/test-build
# It is signed with a debug key, so it is for testing only. Google Play builds use EAS (android-build.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'store/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64-v8a is what phones run; x86_64 is the same app for the emulator used in the smoke test.
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      # One CPU architecture and compressed native libraries keep the download small. Google Play builds
      # are optimised per device by Play itself.
      - name: Build the APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=${{ matrix.abi }}
          -Pexpo.useLegacyPackaging=true

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and click through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke-test.sh apk/app-release.apk smoke-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: smoke-test/
          if-no-files-found: ignore

  publish:
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk

      - name: Publish it on the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-release.apk unravel-korea-test.apk
          notes="Test build of commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)), smoke-tested on an Android emulator.

          **Install on Android:** open this page on your phone, tap **unravel-korea-test.apk**, then open the download and allow installing from this source.

          Signed with a test key — for trying the app, not for Google Play."
          if gh release view test-build >/dev/null 2>&1; then
            # Replace the file in place, so the download link never goes dead between builds.
            gh release upload test-build unravel-korea-test.apk --clobber
            gh release edit test-build --prerelease --title "Test build (Android)" --notes "$notes"
            # Keep the tag (and the release's source-code downloads) on the commit this APK was built from.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/test-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
              echo "::warning::The APK is updated, but the test-build tag could not be moved to $GITHUB_SHA"
          else
            gh release create test-build unravel-korea-test.apk \
              --prerelease --target "$GITHUB_SHA" --title "Test build (Android)" --notes "$notes"
          fi
