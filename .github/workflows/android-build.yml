name: Android build

# Manual: Actions → Android build → Run workflow.
# Needs an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Start EAS build (runs in Expo's cloud)
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
